# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: threatoptic

before:
  hooks:
    - go mod download

builds:
  - id: threatoptic
    main: ./cmd/threatoptic
    binary: threatoptic
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      # Jenkins checkouts often fail `git status` (exit 128: missing repo or
      # dubious ownership). Version is already injected via ldflags.
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: threatoptic
    ids:
      - threatoptic
    # install.sh and install.ps1 reconstruct this name. Changing it breaks them.
    name_template: "threatoptic_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: ThreatOptic
    name: CLI
  prerelease: auto
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
  footer: |
    ## Install

    macOS and Linux:

    ```bash
    curl -fsSL https://github.com/ThreatOptic/CLI/releases/latest/download/install.sh | bash
    ```

    Windows (PowerShell):

    ```powershell
    irm https://github.com/ThreatOptic/CLI/releases/latest/download/install.ps1 | iex
    ```

